spring.application.name=api-gateway
server.port=8080
# Eureka Server Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Enable service discovery routes
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**
# Turf Service
spring.cloud.gateway.server.webmvc.routes[1].id=turf-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://turf-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/turfs/**
# Booking Service
spring.cloud.gateway.server.webmvc.routes[2].id=booking-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://booking-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/bookings/**
# Payment Service
spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payments/**
# Notification Service
spring.cloud.gateway.server.webmvc.routes[4].id=notification-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/notify/**